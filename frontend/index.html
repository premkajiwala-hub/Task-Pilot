<!doctype html>
<html lang="en" data-theme="nocturne">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TaskPilot — a local-first premium task scheduler." />
    <meta name="theme-color" content="#0d1218" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>TaskPilot</title>

    <script>
      // Resolve the stored theme before first paint so there is no flash of the
      // default theme on reload.
      (function () {
        try {
          var t = localStorage.getItem('taskpilot-theme');
          // Map the retired noir/light themes onto their replacements so an
          // existing install does not fall back to the default on upgrade.
          var legacy = { noir: 'nocturne', light: 'sandstone' };
          t = legacy[t] || t;
          if (t === 'nocturne' || t === 'sandstone' || t === 'crimson') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* storage unavailable — keep the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
